[project]
name = "teleforge"
version = "0.1.0"
description = "An opinionated, feature-oriented aiogram application framework"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-only"
dependencies = ["aiogram>=3.31,<4", "pydantic>=2.13,<3"]

[project.optional-dependencies]
media = ["pillow>=12,<13"]

[project.scripts]
teleforge = "teleforge.cli:main"

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teleforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--disable-socket --allow-unix-socket"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/teleforge", "examples"]
# Concrete Derp consumers are checked in Derp's environment with their dependencies.
exclude = ['^examples/derp/(inline\.py|tests/)']

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "BLE"]
