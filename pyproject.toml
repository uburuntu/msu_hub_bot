[tool.ruff.lint.per-file-ignores]
# Existing non-functional warnings are isolated to their legacy files.
"common/externals/other.py" = ["F541"]
"hub_bot/app.py" = ["F401"]
"hub_bot/commands/externals.py" = ["F401", "F541", "F841"]
"hub_bot/commands/minecraft.py" = ["F401", "F541"]
"hub_bot/commands/posting.py" = ["F541"]
"hub_bot/commands/prog.py" = ["F541"]
"hub_bot/commands/settings.py" = ["F541"]
"hub_bot/commands/sticker.py" = ["F541"]
"hub_bot/commands/vk.py" = ["F401", "F541"]
"hub_bot/events.py" = ["F541"]
