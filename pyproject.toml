[project]
name = "msu-hub-bot"
version = "0.1.0"
description = "The revived MSU Hub Telegram bot"
requires-python = ">=3.11,<3.12"
license = "GPL-3.0-only"
dependencies = [
    "aiocache==0.12.2",
    "aiodns==3.2.0",
    "aiogram[proxy,redis]==3.31.0",
    "aiohttp==3.14.3",
    "aiohttp-socks==0.12.0",
    "airtable-python-wrapper==0.15.3",
    "arxiv==0.5.3",
    "beautifulsoup4==4.12.3",
    "Brotli==1.2.0",
    "cachetools==5.3.3",
    "ccxt==4.2.81",
    "dnspython==2.6.1",
    "edgedb==1.9.0",
    "emoji==2.10.1",
    "fonttools==4.50.0",
    "gtts==2.5.1",
    "httpx==0.13.3",
    "jinja2==3.1.3",
    "js2py==0.74",
    "lottie==0.7.0",
    "mcstatus==11.1.1",
    "numpy==1.26.4",
    "opencv-python==4.9.0.80",
    "pendulum==3.0.0",
    "pillow==10.2.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pydub==0.25.1",
    "pyfiglet==1.0.2",
    "pytesseract==0.3.10",
    "pytz==2024.1",
    "redis==7.4.1",
    "requests==2.31.0",
    "tabulate==0.9.0",
    "throttler==1.2.2",
    "transliterate==1.10.2",
    "ujson==5.9.0",
    "youtube-dl==2021.12.17",
    "pyacrcloud; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "babel==2.9.1",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-common==1.44.0",
]

[project.scripts]
msu-hub-bot = "msu_hub_bot.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/msu_hub_bot"]

[dependency-groups]
dev = [
    "ruff==0.15.7",
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "pytest-socket==0.7.0",
    "msgpack==1.1.0",
    "mypy==2.0.0",
    "types-pillow==10.2.0.20240822",
    "types-cachetools==5.3.0.7",
    "types-tabulate==0.9.0.20241207",
]

[tool.uv.sources]
pyacrcloud = { git = "https://github.com/acrcloud/acrcloud_sdk_python", rev = "9d66907bbb3bd5c4c2f22346c4fa039b28f4176a", subdirectory = "linux/x86-64/python3" }

[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = ["src/msu_hub_bot/providers/_api2ch"]

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
warn_unused_configs = true
warn_unused_ignores = true
files = [
    "src/msu_hub_bot/execution/__init__.py",
    "src/msu_hub_bot/caching.py",
    "src/msu_hub_bot/storage/base.py",
    "src/msu_hub_bot/storage/edgedb.py",
    "src/msu_hub_bot/storage/factory.py",
    "src/msu_hub_bot/storage/models.py",
    "src/msu_hub_bot/storage/observations.py",
    "src/msu_hub_bot/storage/supabase.py",
    "src/msu_hub_bot/execution/executor.py",
    "src/msu_hub_bot/providers/dvach.py",
    "src/msu_hub_bot/uptime.py",
    "src/msu_hub_bot/telegram/callbacks.py",
    "src/msu_hub_bot/telegram/chat_actioner.py",
    "src/msu_hub_bot/telegram/command.py",
    "src/msu_hub_bot/telegram/context.py",
    "src/msu_hub_bot/telegram/delivery.py",
    "src/msu_hub_bot/telegram/extraction.py",
    "src/msu_hub_bot/telegram/files.py",
    "src/msu_hub_bot/telegram/filters.py",
    "src/msu_hub_bot/telegram/keyboards.py",
    "src/msu_hub_bot/telegram/middlewares/check_gets.py",
    "src/msu_hub_bot/telegram/middlewares/logs.py",
    "src/msu_hub_bot/telegram/middlewares/settings.py",
    "src/msu_hub_bot/telegram/middlewares/skip777000.py",
    "src/msu_hub_bot/telegram/middlewares/telemetry.py",
    "src/msu_hub_bot/telegram/middlewares/updates.py",
    "src/msu_hub_bot/telegram/middlewares/viewer.py",
    "src/msu_hub_bot/telegram/runtime.py",
    "src/msu_hub_bot/telegram/state.py",
    "src/msu_hub_bot/telegram/storage.py",
    "src/msu_hub_bot/telegram/utils.py",
    "src/msu_hub_bot/telegram/wrapper.py",
    "src/msu_hub_bot/providers/vk/publish.py",
    "src/msu_hub_bot/app.py",
    "src/msu_hub_bot/commands/admin.py",
    "src/msu_hub_bot/commands/animate.py",
    "src/msu_hub_bot/commands/antibot.py",
    "src/msu_hub_bot/commands/arxiv.py",
    "src/msu_hub_bot/commands/camera.py",
    "src/msu_hub_bot/commands/control.py",
    "src/msu_hub_bot/commands/crypto.py",
    "src/msu_hub_bot/commands/debate.py",
    "src/msu_hub_bot/commands/debug.py",
    "src/msu_hub_bot/commands/dvach.py",
    "src/msu_hub_bot/commands/errors.py",
    "src/msu_hub_bot/commands/excuses.py",
    "src/msu_hub_bot/commands/externals.py",
    "src/msu_hub_bot/commands/figlet.py",
    "src/msu_hub_bot/commands/fun.py",
    "src/msu_hub_bot/commands/genders.py",
    "src/msu_hub_bot/commands/geoguess.py",
    "src/msu_hub_bot/commands/help.py",
    "src/msu_hub_bot/commands/infra.py",
    "src/msu_hub_bot/commands/latex.py",
    "src/msu_hub_bot/commands/likes.py",
    "src/msu_hub_bot/commands/lingvanex.py",
    "src/msu_hub_bot/commands/lobster.py",
    "src/msu_hub_bot/commands/location.py",
    "src/msu_hub_bot/commands/minecraft.py",
    "src/msu_hub_bot/commands/other.py",
    "src/msu_hub_bot/commands/personal.py",
    "src/msu_hub_bot/commands/posting.py",
    "src/msu_hub_bot/commands/prog.py",
    "src/msu_hub_bot/commands/raffle.py",
    "src/msu_hub_bot/commands/rate.py",
    "src/msu_hub_bot/commands/rolls.py",
    "src/msu_hub_bot/commands/sed.py",
    "src/msu_hub_bot/commands/settings.py",
    "src/msu_hub_bot/commands/song.py",
    "src/msu_hub_bot/commands/stats.py",
    "src/msu_hub_bot/commands/sticker.py",
    "src/msu_hub_bot/commands/tenet.py",
    "src/msu_hub_bot/commands/tesseract.py",
    "src/msu_hub_bot/commands/tts.py",
    "src/msu_hub_bot/commands/tyan.py",
    "src/msu_hub_bot/commands/vk.py",
    "src/msu_hub_bot/commands/votes.py",
    "src/msu_hub_bot/commands/weather.py",
    "src/msu_hub_bot/commands/zalgo.py",
    "src/msu_hub_bot/events.py",
    "src/msu_hub_bot/routing.py",
    "src/msu_hub_bot/media/caption_layout.py",
    "src/msu_hub_bot/media/ffmpeg.py",
    "src/msu_hub_bot/providers/jdoodle.py",
    "src/msu_hub_bot/execution/sed.py",
    "src/msu_hub_bot/media/sticker_media.py",
    "src/msu_hub_bot/telegram/sticker_sets.py",
    "src/msu_hub_bot/providers/wit.py",
    "src/msu_hub_bot/providers/wolfram.py",
    "src/msu_hub_bot/cli.py",
    "src/msu_hub_bot/fsm_reset.py",
    "src/msu_hub_bot/health.py",
    "src/msu_hub_bot/preflight.py",
    "src/msu_hub_bot/settings.py",
    "src/msu_hub_bot/telemetry.py",
    "tools/check_types.py",
    "tools/migrate_storage.py",
]

[[tool.mypy.overrides]]
# Remove each provider/native exception when its SDK ships types; adapters remain checked.
module = ["aiocache", "arxiv", "gtts", "pytesseract", "acrcloud.recognizer", "lottie", "lottie.*", "fontTools.pens.boundsPen", "pydub", "pydub.effects", "throttler", "transliterate", "pyfiglet", "airtable", "ccxt", "ccxt.async_support"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Tests also exercise repository-local maintenance tools; application imports use the installed package.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
# Freeze the observed runtime without making transitive packages direct dependencies.
constraint-dependencies = [
    "MarkupSafe==2.1.5",
    "aiofiles==23.2.1",
    "aiosignal==1.4.0",
    "async-timeout==4.0.3",
    "asyncio-dgram==2.1.2",
    "attrs==23.2.0",
    "certifi==2024.2.2",
    "cffi==1.16.0",
    "chardet==3.0.4",
    "charset-normalizer==3.3.2",
    "click==8.1.7",
    "cryptography==42.0.5",
    "feedparser==6.0.11",
    "frozenlist==1.4.1",
    "h11==0.9.0",
    "h2==3.2.0",
    "hpack==3.0.0",
    "hstspreload==2024.3.1",
    "httpcore==0.9.1",
    "hyperframe==5.2.0",
    "idna==2.10",
    "magic-filter==1.0.12",
    "multidict==6.0.5",
    "packaging==24.0",
    "pycares==4.4.0",
    "pycparser==2.21",
    "pyjsparser==2.7.1",
    "python-dateutil==2.9.0.post0",
    "python-socks==2.4.4",
    "rfc3986==1.5.0",
    "setuptools==65.5.1",
    "sgmllib3k==1.0.0",
    "six==1.16.0",
    "sniffio==1.3.1",
    "soupsieve==2.5",
    "time-machine==2.14.1",
    "typing_extensions==4.16.0",
    "tzdata==2024.1",
    "tzlocal==5.2",
    "urllib3==2.2.1",
    "yarl==1.25.1",
]

[tool.ruff.lint.per-file-ignores]
# Existing non-functional warnings are isolated to their legacy files.
"src/msu_hub_bot/providers/other.py" = ["F541"]
"src/msu_hub_bot/app.py" = ["F401"]
"src/msu_hub_bot/commands/externals.py" = ["F401", "F541", "F841"]
"src/msu_hub_bot/commands/minecraft.py" = ["F401", "F541"]
"src/msu_hub_bot/commands/posting.py" = ["F541"]
"src/msu_hub_bot/commands/prog.py" = ["F541"]
"src/msu_hub_bot/commands/settings.py" = ["F541"]
"src/msu_hub_bot/commands/sticker.py" = ["F541"]
"src/msu_hub_bot/commands/vk.py" = ["F401", "F541"]
"src/msu_hub_bot/events.py" = ["F541"]
