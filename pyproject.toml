    "dnspython==2.6.1",
    "douyin-tiktok-scraper==1.2.9",
    "edgedb==1.9.0",
    "emoji==2.10.1",
    "feedparser==6.0.11",
    "fonttools==4.50.0",
    "frozenlist==1.4.1",
    "gTTS==2.5.1",
    "googletrans==3.0.0",
    "h11==0.9.0",
    "h2==3.2.0",
    "hpack==3.0.0",
    "hstspreload==2024.3.1",
    "httpcore==0.9.1",
    "httpx==0.13.3",
    "hyperframe==5.2.0",
    "idna==2.10",
    "lottie==0.7.0",
    "magic-filter==1.0.12",
    "mcstatus==11.1.1",
    "multidict==6.0.5",
    "numpy==1.26.4",
    "opencv-python==4.9.0.80",
    "orjson==3.9.15",
    "packaging==24.0",
    "pendulum==3.0.0",
    "pillow==10.2.0",
    "pycares==4.4.0",
    "pycparser==2.21",
    "pycryptodomex==3.20.0",
    "pydantic==2.13.5",
    "pydub==0.25.1",
    "pyfiglet==1.0.2",
    "pyjsparser==2.7.1",
    "pytesseract==0.3.10",
    "python-dateutil==2.9.0.post0",
    "python-socks==2.4.4",
    "pytz==2024.1",
    "redis==7.4.1",
