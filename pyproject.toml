[project]
name = "msu-hub-bot"
version = "0.1.0"
description = "The revived MSU Hub Telegram bot"
requires-python = ">=3.11,<3.12"
license = "GPL-3.0-only"
dependencies = [
    "aiocache==0.12.2",
    "aiogram==2.25.2",
    "aiohttp==3.8.6",
    "aiohttp-socks==0.8.4",
    "aiojobs==1.2.1",
    "aioredis==2.0.1",
    "airtable-python-wrapper==0.15.3",
    "api2ch==1.2.1",
    "apscheduler==3.10.4",
    "arxiv==0.5.3",
    "beautifulsoup4==4.12.3",
    "cachetools==5.3.3",
    "ccxt==4.2.81",
    "dnspython==2.6.1",
    "douyin-tiktok-scraper==1.2.9",
    "edgedb==1.9.0",
    "emoji==2.10.1",
    "fonttools==4.50.0",
    "googletrans==3.0.0",
    "gtts==2.5.1",
    "httpx==0.13.3",
    "jinja2==3.1.3",
    "js2py==0.74",
    "lottie==0.7.0",
    "mcstatus==11.1.1",
    "numpy==1.26.4",
    "opencv-python==4.9.0.80",
    "pendulum==3.0.0",
    "pillow==10.2.0",
    "pycryptodomex==3.20.0",
    "pydantic==1.10.14",
    "pydub==0.25.1",
    "pyfiglet==1.0.2",
    "pytesseract==0.3.10",
    "pytz==2024.1",
    "redis==5.0.3",
    "requests==2.31.0",
    "tabulate==0.9.0",
    "throttler==1.2.2",
    "transliterate==1.10.2",
    "ujson==5.9.0",
    "youtube-dl==2021.12.17",
    "pyacrcloud; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
msu-hub-bot = "msu_hub_bot.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["msu_hub_bot", "hub_bot", "common"]

[dependency-groups]
dev = ["ruff==0.15.7", "pytest==8.3.5", "pytest-asyncio==0.25.3", "pytest-socket==0.7.0", "msgpack==1.1.0"]

[tool.uv.sources]
pyacrcloud = { git = "https://github.com/acrcloud/acrcloud_sdk_python", rev = "9d66907bbb3bd5c4c2f22346c4fa039b28f4176a", subdirectory = "linux/x86-64/python3" }

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
# Freeze the observed runtime without making transitive packages direct dependencies.
constraint-dependencies = [
    "APScheduler==3.10.4",
    "Babel==2.9.1",
    "Brotli==1.1.0",
    "Jinja2==3.1.3",
    "Js2Py==0.74",
    "MarkupSafe==2.1.5",
    "PyExecJS==1.5.1",
    "aiocache==0.12.2",
    "aiodns==3.1.1",
    "aiofiles==23.2.1",
    "aiogram==2.25.2",
