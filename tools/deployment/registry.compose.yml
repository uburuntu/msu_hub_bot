# Release registry for the deployment host. It listens only on loopback; Actions
# reaches it through the deployment key's single permitted SSH forward, and the
# host wrapper pulls releases by digest and deletes pruned manifests.
name: msu_hub_registry
services:
  registry:
    image: registry:3@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
    container_name: msu_hub_registry
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      OTEL_TRACES_EXPORTER: none
    volumes:
      - registry:/var/lib/registry
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  registry:
    name: msu_hub_registry
