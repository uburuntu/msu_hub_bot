name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Mini App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Check Mini App formatting
        id: web_format
        continue-on-error: true
        run: npm run format:check
        working-directory: web
      - name: Warn on Mini App formatting
        if: steps.web_format.outcome == 'failure'
        run: echo "::warning::Mini App formatting check failed; run npm run format in web/"
      - run: npm run typecheck && npm test && npm run build
        working-directory: web

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.12.15
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - name: Check Python formatting
        id: python_format
        continue-on-error: true
        run: uv run --no-sync ruff format --check src tests tools
      - name: Warn on Python formatting
        if: steps.python_format.outcome == 'failure'
        run: echo "::warning::Python formatting check failed; run uv run --no-sync ruff format src tests tools"
      - run: uv run --no-sync python tools/check_types.py
        env:
          TYPECHECK_BASE_REF: ${{ github.event.pull_request.base.sha }}
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -q -n auto

  storage:
    name: PostgreSQL storage contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A plain container starts alongside setup and, unlike a service, needs no teardown.
      - name: Start PostgreSQL
        run: >-
          docker run --detach --name postgres --publish 5432:5432
          --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD=test-only-postgres --env POSTGRES_DB=hub_test_ci
          postgres:17-alpine
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.12.15
          python-version: '3.14'
          enable-cache: true
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - run: uv sync --locked
      - name: Wait for PostgreSQL
        run: timeout 60 sh -c 'until docker exec postgres pg_isready --quiet -U postgres -d hub_test_ci; do sleep 1; done'
      - name: Exercise schema, isolation, quiz scoring, atomic mutations and retention
        run: uv run --no-sync pytest -q tests/test_postgres_storage.py tests/test_feature_postgres.py tests/test_application_postgres.py tests/test_membership_postgres.py tests/test_reminders.py tests/test_chess_match_postgres.py tests/test_raffle_postgres.py tests/test_telegram_state_postgres.py tests/test_feedback_context_postgres.py tests/test_feedback_store_postgres.py
        env:
          HUB_TEST_POSTGRES_DSN: postgresql://postgres:test-only-postgres@localhost:5432/hub_test_ci

  security:
    name: Secrets and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/install_ci_tools.py "$RUNNER_TEMP/tools"
      - run: python3 tools/check_secrets.py
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/tools/gitleaks
      - run: '"$RUNNER_TEMP/tools/actionlint" -color'

  image:
    name: Linux image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Expose the Actions cache to the image build
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Check native libraries and startup, warming the release build cache
        run: python3 tools/deployment/build_release.py
