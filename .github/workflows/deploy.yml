name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and validate private image archive
        id: image
        run: python3 tools/build_release.py
      - name: Skip superseded revisions
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy with automatic rollback
        if: steps.current.outputs.deploy == 'true'
        run: python3 tools/deploy_client.py
        env:
          DEPLOY_ARCHIVE: ${{ steps.image.outputs.archive }}
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          HUB_TELEMETRY_ENABLED: ${{ vars.HUB_TELEMETRY_ENABLED || 'false' }}
          HUB_TELEMETRY_SAMPLE_RATE: ${{ vars.HUB_TELEMETRY_SAMPLE_RATE || '0.1' }}
          HUB_ENVIRONMENT: production
          HUB_RELEASE: ${{ github.sha }}
          HUB_NAME: ${{ secrets.HUB_NAME }}
          HUB_BOT_TOKEN: ${{ secrets.HUB_BOT_TOKEN }}
          HUB_REDIS_HOST: ${{ secrets.HUB_REDIS_HOST }}
          HUB_REDIS_PORT: ${{ secrets.HUB_REDIS_PORT }}
          HUB_REDIS_PASSWORD: ${{ secrets.HUB_REDIS_PASSWORD }}
          HUB_REDIS_DB: ${{ secrets.HUB_REDIS_DB }}
          HUB_EDGEDB_DSN: ${{ secrets.HUB_EDGEDB_DSN }}
          HUB_EDGEDB_TLS_CA: ${{ secrets.HUB_EDGEDB_TLS_CA }}
          HUB_EDGEDB_TLS_SECURITY: ${{ secrets.HUB_EDGEDB_TLS_SECURITY }}
          HUB_PROXY: ${{ secrets.HUB_PROXY }}
          HUB_CERT: ${{ secrets.HUB_CERT }}
          HUB_PKEY: ${{ secrets.HUB_PKEY }}
          HUB_LOGS_FILE: ${{ secrets.HUB_LOGS_FILE }}
          HUB_HEALTH_CHECK_URL: ${{ secrets.HUB_HEALTH_CHECK_URL }}
          HUB_DUMPS_CHAT_ID: ${{ secrets.HUB_DUMPS_CHAT_ID }}
          HUB_EVENTS_CHAT_ID: ${{ secrets.HUB_EVENTS_CHAT_ID }}
          HUB_ERROR_CHAT_ID: ${{ secrets.HUB_ERROR_CHAT_ID }}
          HUB_OWNER_ID: ${{ secrets.HUB_OWNER_ID }}
          HUB_FOUNDER_IDS: ${{ secrets.HUB_FOUNDER_IDS }}
          HUB_FORWARD_CHAT_IDS: ${{ secrets.HUB_FORWARD_CHAT_IDS }}
          HUB_RELATED_CHAT_IDS: ${{ secrets.HUB_RELATED_CHAT_IDS }}
          HUB_POOKIE_CHAT_ID: ${{ secrets.HUB_POOKIE_CHAT_ID }}
          HUB_ECHO_CHAT_ID: ${{ secrets.HUB_ECHO_CHAT_ID }}
          HUB_EXCLUDED_CHAT_ID: ${{ secrets.HUB_EXCLUDED_CHAT_ID }}
          HUB_DVACH_CHAT_IDS: ${{ secrets.HUB_DVACH_CHAT_IDS }}
          HUB_ANTIBOT_USER_ID: ${{ secrets.HUB_ANTIBOT_USER_ID }}
          HUB_POSTING_TB_CHAT_ID: ${{ secrets.HUB_POSTING_TB_CHAT_ID }}
          HUB_POSTING_MAIN_CHAT_ID: ${{ secrets.HUB_POSTING_MAIN_CHAT_ID }}
          HUB_VK_DEFAULT_CHAT_ID: ${{ secrets.HUB_VK_DEFAULT_CHAT_ID }}
          HUB_TENET_STICKER_OWNER_ID: ${{ secrets.HUB_TENET_STICKER_OWNER_ID }}
          HUB_VK_USER_TOKEN: ${{ secrets.HUB_VK_USER_TOKEN }}
          HUB_WOLFRAM_TOKEN: ${{ secrets.HUB_WOLFRAM_TOKEN }}
          HUB_WIT_TOKENS: ${{ secrets.HUB_WIT_TOKENS }}
          HUB_JDOODLE_TOKENS: ${{ secrets.HUB_JDOODLE_TOKENS }}
          HUB_LINGVANEX_AUTHORIZATION: ${{ secrets.HUB_LINGVANEX_AUTHORIZATION }}
          HUB_LINGVANEX_IMAGE_AUTHORIZATION: ${{ secrets.HUB_LINGVANEX_IMAGE_AUTHORIZATION }}
          HUB_REMOVE_BG_API_KEY: ${{ secrets.HUB_REMOVE_BG_API_KEY }}
          HUB_IMGUR_AUTHORIZATION: ${{ secrets.HUB_IMGUR_AUTHORIZATION }}
          HUB_OWM_KEY: ${{ secrets.HUB_OWM_KEY }}
          HUB_OWM_MAP_KEY: ${{ secrets.HUB_OWM_MAP_KEY }}
          HUB_MAPBOX_KEY: ${{ secrets.HUB_MAPBOX_KEY }}
          HUB_ACRCLOUD_HOST: ${{ secrets.HUB_ACRCLOUD_HOST }}
          HUB_ACRCLOUD_ACCESS_KEY: ${{ secrets.HUB_ACRCLOUD_ACCESS_KEY }}
          HUB_ACRCLOUD_ACCESS_SECRET: ${{ secrets.HUB_ACRCLOUD_ACCESS_SECRET }}
          HUB_SUPPORTERS_BASE: ${{ secrets.HUB_SUPPORTERS_BASE }}
          HUB_SUPPORTERS_TABLE: ${{ secrets.HUB_SUPPORTERS_TABLE }}
          HUB_SUPPORTERS_API_KEY: ${{ secrets.HUB_SUPPORTERS_API_KEY }}
      - name: Remove private image archive
        if: always()
        env:
          DEPLOY_ARCHIVE: ${{ steps.image.outputs.archive }}
        run: |
          if [ -n "$DEPLOY_ARCHIVE" ]; then
            rm -f -- "$DEPLOY_ARCHIVE" "$(dirname -- "$DEPLOY_ARCHIVE")/metadata.json"
          fi
